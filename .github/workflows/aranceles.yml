name: Sincronizador de Aranceles RedSalud

on:
  schedule:
    # Ejecución automática diaria a las 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  sincronizar_aranceles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth pandas openpyxl xlrd

      - name: Ejecutar Ingesta de Aranceles (data/raw -> RAW_Data_Ingesta)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python sync_aranceles.py
