name: Sincronizador LicitaLAB RedSalud

on:
  schedule:
    - cron: '0 8 * * *'  # Ejecución automática diaria a las 08:00 UTC
  workflow_dispatch:      # Permite la ejecución manual desde la pestaña Actions

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías requeridas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Sincronización
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          LICITALAB_TOKEN: ${{ secrets.LICITALAB_TOKEN }}
        run: |
          python main.py
