name: Sincronizador LicitaLAB RedSalud

on:
  schedule:
    - cron: '0 8 * * *'  # Se ejecuta automáticamente todos los días
  workflow_dispatch:      # Permite la ejecución manual desde la pestaña Actions

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías requeridas
        run: |
          python -m pip install --upgrade pip
          pip install pandas gspread google-auth requests

      - name: Ejecutar Sincronización
        env:
          GCP_JSON_BASE64: ${{ secrets.GCP_JSON_BASE64 }}
        run: python main.py
